<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آموزش و آزمون کارکنان فروشگاه لوازم یدکی</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="home">
  <div class="hero">
    <h1>آموزش کارکنان</h1>
  </div>
  <div class="roles" id="roles"></div>
</main>

<div id="course" hidden>
  <header class="chead"><button class="back" id="backBtn">‹ بازگشت به انتخاب سمت</button><h2 id="courseTitle"></h2></header>
  <div class="layout">
    <aside class="side">
      <div class="ring" id="ring"><b id="ringTxt"></b></div>
      <div id="status"></div>
      <nav id="toc"></nav>
      <button class="btn startQuiz" disabled>شروع آزمون</button>
      <p class="examMsg"></p>
    </aside>
    <div class="content"><div id="sections"></div><div id="books"></div>
      <section class="exam-end"><h3>آزمون پایان دوره</h3><p class="examMsg"></p><button class="btn startQuiz" disabled>شروع آزمون</button></section>
    </div>
  </div>
</div>

<div id="quiz" class="overlay" hidden>
  <div class="modal">
    <div class="qhead"><span id="qCount"></span><span id="qScore"></span></div>
    <div class="qprog"><i id="qProgFill"></i></div>
    <h3 id="qText"></h3>
    <div id="qOpts"></div>
    <div id="qFeedback" class="feedback" hidden></div>
    <button class="btn" id="qNext" hidden>سؤال بعدی</button>
    <div id="qResult" hidden></div>
    <button class="link" id="qClose">بستن</button>
  </div>
</div>
<div id="fx"></div>
<script src="script.js"></script>
</body>
</html>
